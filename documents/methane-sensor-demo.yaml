  competency:
    - "SAIL General Local Induction completed (laboratory hazards, emergency procedures and reporting)"
    - "Demonstration-specific briefing delivered by the supervisor before each event: properties of the 1% CH4 / N2 mixture (non-flammable at any dilution, simple asphyxiant, Class 2.2); cylinder handling (transport, shade, valve closed between fills, never heat, never refill); regulator fitting, leak check and balloon filling to 15 cm; the balloon hand-over rule and the no-inhalation rule; sensor setup, battery and RCD use, fibre connector rule; emergency procedures, contacts, first aid post and assembly point"
    - "Working with the public: supervising children with a parent or carer present; latex allergy and choking hazard awareness; crowd management and event marshal directions"
    - "First aid awareness: response to a person who feels faint; when to call 000 and Security; location of the first aid kit, eye rinse and event AED"
    - "Theory assessment (oral questioning by the supervisor): why the gas cannot burn and why it is Class 2.2; what to do if someone inhales from a balloon; when the cylinder valve must be closed; the balloon hand-over rule; emergency contacts. All safety-critical questions must be answered correctly"
    - "Practical assessment (supervised): fitting the regulator, leak check and closing the valve; filling and tying off a balloon to 15 cm; handing a balloon to a participant, supervising the release and taking it back; emergency shutdown (closing the valve, switching off equipment). Any safety-critical error requires re-briefing and reassessment"
    - "Ongoing: briefing repeated before every event; retraining after any incident or near miss, when this SWP or the RA is updated, or if unsafe practice is observed. Briefing attendance and sign-off recorded by the supervisor; balloon count sheets and cylinder log retained"
  assessors:
    - "Chris Betters (Senior Research Fellow, SAIL)"

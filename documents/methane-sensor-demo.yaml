# Combined RA + SWP data for the public methane sensor demonstration
# (balloons filled with 1% CH4 / balance N2 calibration gas from a 103 L disposable cylinder).
# Product details from CAC Gas quotation SQ1070 (15/09/2026) and SDS No. 303.
# Render: python docgen/render.py documents/methane-sensor-demo.yaml

meta:
  slug: methane-sensor-demo
  building: A14
  name: "Methane sensor public demonstration (1% CH4 balloons)"
  title: "Public demonstration of the SAIL fibre optic methane sensor using balloons filled with 1% CH4 / balance N2 calibration gas (103 L disposable cylinder)"
  status: Draft
  version: "1.0"
  version_issue_date: "2026-09-18"
  description: "Public outreach demonstration of the SAIL fibre optic methane sensor in the Main Quadrangle cloisters using balloons filled with 1% methane in nitrogen from a 103 L disposable calibration gas cylinder (UN1956, Class 2.2 non-flammable, non-toxic)."
  key_hazards: "Compressed gas (70 bar), simple asphyxiant gas mixture, balloon burst and inhalation, latex and choking hazards, electrical equipment outdoors, public crowd environment"
  includes: "Cylinder transport and checks, regulator fitting, balloon filling, public hand-over rules, sensor setup, emergency procedures, pack-down and disposal"
  faculty_school: "School of Physics"
  prepared_by: "Chris Betters"
  supervisors:
    - "Chris Betters"
  issue_date: "2026-09-18"
  next_review_date: "2027-09-18"

ra:
  activity: |-
    - Transport and storage of one 103 L disposable steel cylinder of 1% methane (CH4) in nitrogen (N2), CAC Gas part 103DS1VCH4N, SDS No. 303, fill pressure 70 bar, net gas mass 140 g, C10 brass valve
    - Fitting a C10 flow regulator and filling small balloons (approximately 1.5 to 2 L each) with the gas mixture
    - Members of the public releasing balloon gas near the intake tube of the SAIL fibre optic methane sensor and watching the live reading respond
    - Operation of the sensor apparatus (fibre-coupled interrogator, laptop, small sample pump) on a display table
    - Pack-down, venting of any remaining gas, and disposal of balloons and the empty cylinder
    - PRODUCT SUMMARY: 1.00% CH4 v/v (10,000 ppm), balance N2, no oxygen, no odorant. UN1956 Compressed gas, n.o.s. (methane, nitrogen mixture), Class 2.2 non-flammable, non-toxic gas (not Class 2.1 flammable gas, the class of LPG cooking cylinders). Cylinder approximately 1.5 L internal volume, roughly the size of a 1.25 L drink bottle, gross mass approximately 1 kg, 60 month shelf life, store below 50 degrees C
    - QUANTITY: total gas 103 L at atmospheric pressure (140 g); total methane 1.03 L (0.74 g), chemical energy approximately 37 kJ, the same as a tea-light candle burning for about 17 minutes. An 8.5 kg LPG barbecue cylinder holds about 390 MJ, over 10,000 times more
    - FLAMMABILITY: methane burns in air only between 5.0% and 15% v/v. The cylinder gas is 1% methane with no oxygen, so the cylinder contents cannot burn, and mixing with air only dilutes the methane further. There is NO ratio of this gas and air that is flammable
    - WORST CASE RELEASE: if the whole cylinder emptied inside a closed 3 m x 3 m x 2.5 m room (22,500 L) the oxygen concentration would fall from 20.9% to 20.8% and the methane concentration would be 46 ppm. In the open-air cloisters the effect is not measurable
  location: "Main Quadrangle cloisters (Building A14), among the interactive alley displays; alternative location Eastern Avenue (outdoors). Both locations are open-air with unrestricted natural ventilation. Cylinder stored before and after the event in the SAIL laboratory, Sydney Nanoscience Hub (A31), Level 2, Room P2012."
  persons_at_risk:
    - "Members of the public, including children and people with latex allergy"
    - "SAIL staff and students acting as demonstrators"
    - "Event and venue staff, other exhibitors"
    - "Passers-by in the cloisters and adjoining walkways"
  team:
    - "Chris Betters (Senior Research Fellow, SAIL, activity supervisor)"
    - "SAIL demonstrators rostered for the event"
    - "TODO: event coordinator name"
  references:
    - "Work Health and Safety Act 2011 (NSW)"
    - "Work Health and Safety Regulation 2017 (NSW), Chapter 7 Hazardous Chemicals"
    - "Australian Code for the Transport of Dangerous Goods by Road and Rail (ADG Code), edition 7.9: classification of UN1956 as Class 2.2 non-flammable, non-toxic gas"
    - "AS 4332-2004 The storage and handling of gases in cylinders"
    - "AS/NZS 60079.10.1:2022 Explosive atmospheres, Classification of areas, Explosive gas atmospheres (confirms no hazardous area is created)"
    - "AS/NZS 2243.1:2021 Safety in laboratories, Planning and operational aspects"
    - "AS/NZS 2243.2:2021 Safety in laboratories, Chemical aspects and storage"
    - "AS/NZS 3760:2022 In-service safety inspection and testing of electrical equipment"
    - "AS/NZS 3000:2018 Wiring Rules (RCD protection for portable equipment)"
    - "Safe Work Australia Code of Practice: Managing risks of hazardous chemicals in the workplace"
    - "Safe Work Australia Workplace Exposure Standards for Airborne Contaminants (methane and nitrogen are simple asphyxiants with no exposure standard)"
    - "CAC Gas and Instrumentation quotation SQ1070 and Safety Data Sheet No. 303 (1% CH4 in N2)"
    - "Protection of the Environment Operations Act 1997 (NSW) (balloon release is littering)"
    - "University of Sydney WHS Policy 2016 and event risk management requirements"
    - "SAIL General Laboratory Risk Assessment (general-lab-safety)"
  risks:
    - task: "Transport of the cylinder from SAIL (A31 P2012) to the venue and storage during the event"
      hazards: "Compressed gas at 70 bar in a small steel cylinder; cylinder dropped or valve struck"
      harm: |-
        - Valve damaged and cylinder vents rapidly; cylinder may skitter or become a projectile
        - Crush or laceration injury to hands or feet from a dropped cylinder
        - Rupture if heated above 50 degrees C (for example left in a closed car or in direct sun on a hot day)
      controls: |-
        - Cylinder is small (approximately 1 kg) with low stored energy compared with industrial cylinders
        - Valve closed and regulator removed for transport
        - Contents are non-flammable and non-toxic, so a venting cylinder creates no fire or poisoning hazard
      current_rating: "Low"
      additional_controls: |-
        - Transport the cylinder upright in a padded box with the valve protected, never loose in a backpack
        - Carry by hand or on a trolley; never throw or roll the cylinder
        - Keep the cylinder out of direct sun and away from any heat source; do not leave it in a parked vehicle
        - Keep the cylinder in the shaded, staffed part of the display, secured so it cannot be knocked over
        - Only one cylinder taken to the venue
      residual_rating: "Low"
    - task: "Any release of the gas mixture (leak, valve left open, balloon burst, or complete loss of the cylinder contents)"
      hazards: "Perceived fire or explosion hazard from a methane cylinder"
      harm: |-
        - No harm. The mixture is 1% methane in nitrogen with no oxygen; methane burns only between 5% and 15% in air
        - The cylinder gas cannot ignite and no mixture of it with air is flammable
        - Total methane in the cylinder is 1.03 L (0.74 g, about 37 kJ), less energy than a tea-light candle burns in 20 minutes
      controls: |-
        - Product classified Class 2.2 non-flammable, non-toxic (UN1956) by the supplier under the ADG Code
        - No flames, heaters or hot surfaces used anywhere in the demonstration
        - Open-air venue
      current_rating: "Low"
      additional_controls: |-
        - Provide the venue with SDS No. 303, the product description and this risk assessment so the cylinder is not mistaken for a fuel gas cylinder
        - Display a table sign: Calibration gas, 1% methane in nitrogen, non-flammable, Class 2.2
      residual_rating: "Low"
    - task: "Complete release of the cylinder contents in the display area"
      hazards: "Simple asphyxiant (nitrogen, methane) displacing oxygen"
      harm: |-
        - Oxygen-deficient atmosphere causing dizziness or loss of consciousness
        - Not credible here: the entire 103 L cylinder released in a closed 22,500 L room reduces oxygen from 20.9% to 20.8%; the cloisters and Eastern Avenue are open air with unlimited dilution
      controls: |-
        - Total gas quantity is 103 L (140 g), far below any quantity that could reduce oxygen in an open area
        - Venue is open air with continuous natural ventilation
      current_rating: "Low"
      additional_controls: |-
        - Do not store or use the cylinder in a small enclosed space (cupboard, van, small room with the door shut)
        - Cylinder valve closed whenever balloons are not being filled
      residual_rating: "Low"
    - task: "Fitting the C10 regulator and filling balloons (staff task)"
      hazards: "Gas jet from the C10 outlet at up to 70 bar if the regulator is cross-threaded or the balloon slips off; balloon over-inflated and bursts"
      harm: |-
        - Gas jet to the eye causing corneal injury
        - Balloon burst causing a loud bang (startle) and latex fragments to the face or eye
        - Regulator or fitting ejected if incorrectly fitted
      controls: |-
        - Regulator is a fixed-flow type (nominal 1 L/min) so the delivered flow is low even if the balloon detaches
        - Balloons are small (23 cm size) and filled only to approximately 15 cm diameter (1.5 to 2 L), well below burst size
        - Only trained SAIL demonstrators fill balloons
      current_rating: "Low"
      additional_controls: |-
        - Filling done by staff only, at the back of the table facing away from the public, wearing safety glasses
        - Check the regulator thread engages by hand and is fully seated before opening the valve; never force the thread
        - Close the cylinder valve between fills and at any time the table is unattended
        - Fill a batch of 10 to 15 balloons in advance and tie them off
        - Inspect each balloon before handing over; discard any that are weak, perished or over-stretched
      residual_rating: "Low"
    - task: "Members of the public handling a balloon and releasing gas near the sensor intake"
      hazards: "Inhalation of oxygen-free balloon gas (someone attempts the helium voice trick with a nitrogen balloon)"
      harm: |-
        - A single breath from a 2 L balloon causes at most brief light-headedness
        - Repeated deliberate inhalation could cause fainting and a fall; nitrogen gives no warning of oxygen deficiency
      controls: |-
        - Balloons are small (1.5 to 2 L), so a single breath is a limited dose
        - The gas does not float (density close to air) so it is not associated with the helium voice trick
        - A demonstrator stands at the sensor table at all times
      current_rating: "Medium"
      additional_controls: |-
        - A demonstrator hands each balloon over, stays within arm's reach and takes it back immediately after the release; balloons are NEVER given away or left on the table
        - Demonstrator explains before handing over: squeeze the neck and let the gas out near the tube; do not breathe it in, it has no oxygen in it
        - Table sign: Do not inhale balloon gas
        - Children under 12 interact only with a parent or carer present; the demonstrator may hold the balloon for young children
        - Any person who inhales gas is moved into fresh air and observed; first aid summoned if they feel faint
      residual_rating: "Low"
    - task: "Members of the public, particularly children, handling latex balloons"
      hazards: "Latex allergy; choking hazard from burst balloon fragments; balloon litter"
      harm: |-
        - Allergic reaction (skin rash, in rare cases anaphylaxis) in latex-sensitised people
        - Choking on latex fragments (young children)
        - Balloon fragments or whole balloons left in the heritage cloisters or released as litter
      controls: |-
        - Balloons are handled for seconds and returned to the demonstrator
        - Gas does not float so balloons cannot drift away
        - Only a small number of balloons (10 to 15) in circulation at any time
      current_rating: "Low"
      additional_controls: |-
        - Use latex-free (chloroprene or foil) balloons where practicable; if latex balloons are used, display a Contains latex notice and offer a demonstrator-operated release
        - Burst balloon fragments picked up immediately by the demonstrator and binned
        - Keep a lidded bin at the table; count balloons out and back; leave no balloon material at the venue
      residual_rating: "Low"
    - task: "Operation of the sensor apparatus (fibre-coupled interrogator, laptop, small diaphragm sample pump) on a table outdoors"
      hazards: "Electrical equipment (240 V mains or battery) used outdoors; cables across walkways"
      harm: |-
        - Electric shock if mains equipment gets wet (rain, spilt drinks)
        - Trip and fall on cables in a public walkway
      controls: |-
        - Interrogator and laptop are low-power (under 100 W) and battery-capable
        - All mains equipment tested and tagged under AS/NZS 3760
        - Venue supply is RCD protected
      current_rating: "Low"
      additional_controls: |-
        - Run the demonstration from battery power where possible; if mains is used, use a single tested and tagged lead through a portable RCD and keep the connection under cover
        - Route cables along the wall or under a cable cover, never across the pedestrian route
        - Stop the demonstration and cover equipment if rain reaches the table
      residual_rating: "Low"
    - task: "Operation of the sensor optical source (fibre-coupled laser or broadband source in the 1600 to 1700 nm band)"
      hazards: "Invisible infrared laser radiation if a fibre connector were opened"
      harm: |-
        - Eye exposure to an infrared beam from an open fibre end
      controls: |-
        - All light is contained within optical fibre and the interrogator enclosure; no beam is accessible in normal operation
        - Fibre connectors are behind the table and out of public reach
        - Source power is low (TODO: confirm laser class from the interrogator label)
      current_rating: "Low"
      additional_controls: |-
        - Do not disconnect or reconnect any fibre connector while the source is on and while the public is present
        - Tape or cable-tie the fibre run so it cannot be pulled or snagged
        - Interrogator switched off if any fibre is damaged
      residual_rating: "Low"
    - task: "Public crowd around the display table in the cloisters"
      hazards: "Crowding, queueing, children running, heritage sandstone surroundings"
      harm: |-
        - Trips and falls, bumps against the table, table tipped over (equipment and cylinder falling)
        - Damage to heritage fabric
      controls: |-
        - Table set against the cloister wall so people approach from one side only
        - Two demonstrators on the stand during opening hours
        - Nothing fixed to walls or columns
      current_rating: "Low"
      additional_controls: |-
        - Keep the cylinder, regulator and pump at the back of the table or in a box on the ground behind the table
        - Maintain a clear 1.5 m path past the display
        - Weight or sandbag the table if it is lightweight
        - Follow event marshal directions on crowd flow
      residual_rating: "Low"
    - task: "Display located outdoors on Eastern Avenue (alternative location)"
      hazards: "Sun and heat exposure of the cylinder and staff; wind"
      harm: |-
        - Cylinder pressure rises with temperature (rated for use below 50 degrees C); rupture is not credible below this
        - Heat illness and sunburn for demonstrators
        - Balloons and light equipment blown away
      controls: |-
        - Cylinder rated to 50 degrees C and kept in its box in shade
        - Event provides marquee or shade
      current_rating: "Low"
      additional_controls: |-
        - Position the display under a marquee or umbrella; keep the cylinder in shade at all times and touch-check it is not warm before filling
        - Demonstrators use hat, sunscreen and water; rotate breaks every 2 hours
        - Tie filled balloons to a weighted string or keep them in a lidded tub
      residual_rating: "Low"
    - task: "Pack-down: venting remaining gas and disposing of the empty cylinder"
      hazards: "Compressed gas; disposal of a pressurised container"
      harm: |-
        - Cylinder disposed of with residual pressure into general waste, or attempted refill
        - Cylinder valve opened indoors in a confined space
      controls: |-
        - Non-refillable cylinder with a supplier disposal instruction
        - Contents non-flammable and non-toxic, so venting is harmless outdoors
      current_rating: "Low"
      additional_controls: |-
        - If the cylinder is to be disposed of, vent it fully outdoors or in a fume cupboard (valve open until the regulator gauge reads zero), mark it EMPTY and dispose of it via the University scrap metal or hazardous waste stream
        - If gas remains for future use, close the valve, remove the regulator and return the cylinder to the gas cabinet in A31 P2012
      residual_rating: "Low"
